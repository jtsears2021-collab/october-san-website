<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="October-San">
  <meta name="theme-color" content="#080A0E">
  <title>October-San</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --sky: #6BADE8;
      --black: #080A0E;
      --dark: #0D1117;
      --card: #111620;
      --text: #E8EDF5;
      --muted: #6B7A99;
      --faint: #2A3347;
      --green: #6BE8A0;
      --red: #E86B6B;
    }
    html, body {
      height: 100%;
      background: var(--black);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      overscroll-behavior: none;
    }
    
    /* ─── APP SHELL ─── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    /* ─── STICKY HEADER ─── */
    #header {
      flex-shrink: 0;
      background: var(--black);
      border-bottom: 1px solid var(--faint);
      padding: 12px 16px 0;
      z-index: 100;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem;
      font-style: italic;
      color: var(--text);
      text-decoration: none;
    }
    .logo span { color: var(--sky); }
    .header-username {
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--muted);
    }

    /* ─── MINT HERO (sticky) ─── */
    #mint-hero {
      flex-shrink: 0;
      background: var(--black);
      z-index: 99;
    }
    .mint-icon-wrap {
      box-shadow: 0 0 0 1px var(--faint), 0 0 24px rgba(107,173,232,0.8);
      border-radius: 22px;
      margin-bottom: 16px;
    }
    .mint-icon-wrap img {
      width: 80px;
      height: 80px;
      border-radius: 22px;
      display: block;
    }
    .hero-title {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--text);
      margin-bottom: 4px;
    }
    .hero-script {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.6rem;
      margin-bottom: 4px;
    }
    .hero-script span { color: var(--sky); }
    .hero-sub {
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--text);
      margin-bottom: 16px;
    }
    .mint-btn {
      background: var(--sky);
      color: var(--black);
      border: none;
      border-radius: 4px;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      padding: 14px 32px;
      cursor: pointer;
      width: 100%;
      max-width: 360px;
    }
    .mint-btn:active { opacity: 0.85; }

    /* ─── FEED ─── */
    #feed {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: y mandatory;
    }

    .nft-card {
      scroll-snap-align: start;
      height: calc(100dvh - 125px);
      position: relative;
      background: var(--black);
      border-bottom: 1px solid var(--faint);
    }

    .nft-card-media {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .nft-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .nft-card-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px 16px 24px;
      background: linear-gradient(transparent, rgba(8,10,14,0.9));
    }

    .nft-card-user {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--card);
      border: 1px solid var(--sky);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: var(--sky);
      font-weight: 700;
      flex-shrink: 0;
    }

    .user-info { flex: 1; }
    .user-name {
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 1px;
    }
    .nft-name {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.5px;
    }

    .nft-card-token {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(8,10,14,0.7);
      color: var(--sky);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 4px 10px;
      border-radius: 4px;
    }

    .nft-card-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn-buy {
      background: var(--green);
      color: var(--black);
      border: none;
      border-radius: 4px;
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      padding: 10px 20px;
      cursor: pointer;
      flex: 1;
    }

    .btn-list {
      background: transparent;
      color: var(--sky);
      border: 1px solid var(--sky);
      border-radius: 4px;
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      padding: 10px 20px;
      cursor: pointer;
      flex: 1;
      text-decoration: none;
      text-align: center;
    }

    .price-tag {
      background: rgba(8,10,14,0.8);
      color: var(--text);
      font-size: 11px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 4px;
      border: 1px solid var(--faint);
    }

    .listed-border {
      position: absolute;
      inset: 0;
      border: 2px solid var(--sky);
      pointer-events: none;
    }

    /* ─── LOADING ─── */
    .feed-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 300px;
      gap: 16px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 2px;
    }
    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid var(--faint);
      border-top-color: var(--sky);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── SIGN IN OVERLAY ─── */
    #signin-overlay {
      position: fixed;
      inset: 0;
      background: var(--black);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    #signin-overlay.hidden { display: none; }

    .signin-icon-wrap {
      box-shadow: 0 0 0 1px var(--faint), 0 0 24px rgba(107,173,232,0.8);
      border-radius: 22px;
      margin-bottom: 20px;
    }
    .signin-icon-wrap img {
      width: 90px;
      height: 90px;
      border-radius: 22px;
      display: block;
    }
    .signin-logo {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 2rem;
      margin-bottom: 32px;
    }
    .signin-logo span { color: var(--sky); }

    .btn-apple {
      background: #fff;
      color: #000;
      border: 1px solid #000;
      border-radius: 6px;
      width: 100%;
      max-width: 320px;
      height: 44px;
      font-family: -apple-system, sans-serif;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .btn-google {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--faint);
      border-radius: 6px;
      width: 100%;
      max-width: 320px;
      height: 44px;
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .signin-skip {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 1px;
      cursor: pointer;
      margin-top: 8px;
      background: none;
      border: none;
      font-family: 'DM Mono', monospace;
    }

    /* ─── ONBOARDING ─── */
    #onboarding-overlay {
      position: fixed;
      inset: 0;
      background: var(--black);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    #onboarding-overlay.hidden { display: none; }
    .username-input {
      background: var(--card);
      border: 1px solid var(--faint);
      border-radius: 4px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 18px;
      padding: 14px 16px;
      width: 100%;
      max-width: 320px;
      outline: none;
      margin-bottom: 12px;
      text-align: center;
      letter-spacing: 2px;
    }
    .username-input:focus { border-color: var(--sky); }
    .btn-continue {
      background: var(--sky);
      color: var(--black);
      border: none;
      border-radius: 4px;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      padding: 14px;
      width: 100%;
      max-width: 320px;
      cursor: pointer;
    }
    .username-hint {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 1px;
      margin-bottom: 16px;
      text-align: center;
    }

    /* ─── TAB BAR ─── */
    #tab-bar {
      flex-shrink: 0;
      display: flex;
      background: var(--black);
      border-top: 1px solid var(--faint);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .tab {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0;
      cursor: pointer;
      border: none;
      background: none;
      color: var(--sky);
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      letter-spacing: 1.5px;
      gap: 4px;
      text-decoration: none;
    }
    .tab.active { color: var(--text); }
    .tab-icon { font-size: 18px; }

    /* ─── EMPTY STATE ─── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 300px;
      gap: 12px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 1px;
      text-align: center;
      padding: 2rem;
    }
  </style>
</head>
<body>

<!-- SIGN IN OVERLAY -->
<div id="signin-overlay">
  <div class="signin-icon-wrap">
    <img src="/icon.png" alt="October-San" />
  </div>
  <div class="signin-logo">October-<span>San</span>™</div>
  <button class="btn-apple" onclick="signIn('apple')">
    <svg width="18" height="22" viewBox="0 0 18 22" fill="black" xmlns="http://www.w3.org/2000/svg">
      <path d="M14.8 11.3c0-2.9 2.4-4.3 2.5-4.4-1.4-2-3.5-2.3-4.2-2.3-1.8-.2-3.5 1-4.4 1-.9 0-2.3-1-3.8-1-1.9 0-3.7 1.1-4.7 2.9-2 3.5-.5 8.6 1.4 11.5 1 1.4 2.1 2.9 3.6 2.8 1.4-.1 2-.9 3.7-.9 1.7 0 2.2.9 3.7.9 1.5 0 2.5-1.4 3.5-2.8.7-1 1.3-2.1 1.6-3.2-3.5-1.4-3.4-5.5-.9-5.5zM12.4 3.2c.8-1 1.3-2.3 1.2-3.7-1.2.1-2.6.8-3.4 1.8-.8.9-1.4 2.2-1.2 3.5 1.3.1 2.6-.6 3.4-1.6z"/>
    </svg>
    Sign in with Apple
  </button>
  <button class="btn-google" onclick="signIn('google')">
    G &nbsp; Sign in with Google
  </button>
  <button class="signin-skip" onclick="browseWithoutSignIn()">BROWSE WITHOUT SIGNING IN →</button>
</div>

<!-- ONBOARDING OVERLAY -->
<div id="onboarding-overlay" class="hidden">
  <div class="signin-icon-wrap">
    <img src="/icon.png" alt="October-San" />
  </div>
  <div class="signin-logo">October-<span>San</span>™</div>
  <div class="username-hint">CHOOSE YOUR COLLECTOR NAME</div>
  <div style="display:flex;align-items:center;gap:4px;margin-bottom:12px;">
    <span style="color:var(--muted);font-size:1.2rem;">@</span>
    <input type="text" class="username-input" id="username-input" placeholder="yourname" maxlength="20" autocapitalize="none" autocorrect="off" />
  </div>
  <div style="color:var(--muted);font-size:9px;letter-spacing:1px;margin-bottom:16px;">This is not your Apple ID — just your October-San username.</div>
  <button class="btn-continue" onclick="completeOnboarding()">LET'S GO</button>
</div>

<!-- MAIN APP -->
<div id="app">

  <!-- MINT HERO (sticky) -->
  <div id="mint-hero" style="display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--faint);background:var(--black);">
    <div class="mint-icon-wrap" style="margin-bottom:0;flex-shrink:0;">
      <img src="/icon.png" alt="October-San" style="width:44px;height:44px;border-radius:10px;display:block;" />
    </div>
    <button class="mint-btn" onclick="goMint()" style="flex:1;padding:12px;">TAP TO MINT YOUR MOMENT</button>
    <span id="header-username" style="color:var(--muted);font-size:9px;letter-spacing:1px;white-space:nowrap;"></span>
  </div>

  <!-- FEED -->
  <div id="feed">
    <div class="feed-loading" id="feed-loading">
      <div class="spinner"></div>
      <span>LOADING MOMENTS...</span>
    </div>
    <div id="feed-content"></div>
    <div id="feed-empty" class="empty-state" style="display:none;">
      <div>No moments yet.</div>
      <div style="color:var(--muted);">Be the first to mint at the stadium.</div>
    </div>
  </div>

  <!-- TAB BAR -->
  <div id="tab-bar">
    <a class="tab active" href="/" id="tab-home">
      <span class="tab-icon">◉</span>
      <span>HOME</span>
    </a>
    <a class="tab" href="/daily" id="tab-daily">
      <span class="tab-icon">⊞</span>
      <span>DAILY</span>
    </a>
    <a class="tab" href="/my" id="tab-my">
      <span class="tab-icon">◯</span>
      <span>MY</span>
    </a>
    <a class="tab" href="/profile" id="tab-profile">
      <span class="tab-icon">⊙</span>
      <span>PROFILE</span>
    </a>
  </div>

</div>

<script type="module">
  import { createThirdwebClient } from 'https://esm.sh/thirdweb@5.120.1';
  import { inAppWallet } from 'https://esm.sh/thirdweb@5.120.1/wallets';
  import { polygon } from 'https://esm.sh/thirdweb@5.120.1/chains';
  import { ethers } from 'https://esm.sh/ethers@5.7.2';

  // ─── CONFIG ───────────────────────────────────────────────
  const CLIENT_ID = 'fb1460b2756706cc08a4f650e68fd526';
  const CONTRACT_ADDRESS = '0x397160Ad067BaaBa7f35Dd0b7A5C25F836b2539F';
  const MARKETPLACE_ADDRESS = '0xef77CDF9Dc521563270B6aBba379dbc3d389C08c';
  const FIREBASE_URL = 'https://firestore.googleapis.com/v1/projects/october-san-e3a33/databases/(default)/documents';
  const FIREBASE_API_KEY = 'AIzaSyBX6hKfUBi8oXx9ew22-jLpL4SxQJKoRIg';

  const client = createThirdwebClient({ clientId: CLIENT_ID });

  let currentUser = null;
  let connectedWallet = null;
  let connectedAccount = null;

  // ─── FIREBASE HELPERS ─────────────────────────────────────
  function parseField(f) {
    if (!f) return null;
    if (f.stringValue !== undefined) return f.stringValue;
    if (f.booleanValue !== undefined) return f.booleanValue;
    if (f.integerValue !== undefined) return parseInt(f.integerValue);
    return null;
  }

  async function firebaseGet(path) {
    const res = await fetch(`${FIREBASE_URL}/${path}?key=${FIREBASE_API_KEY}`);
    return res.json();
  }

  async function firebaseSet(path, fields) {
    const res = await fetch(`${FIREBASE_URL}/${path}?key=${FIREBASE_API_KEY}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fields })
    });
    return res.json();
  }

  // ─── AUTH ─────────────────────────────────────────────────
  async function checkExistingSession() {
    const stored = localStorage.getItem('octsn_user');
    if (stored) {
      currentUser = JSON.parse(stored);
      document.getElementById('header-username').textContent = '@' + currentUser.username;
      document.getElementById('signin-overlay').classList.add('hidden');
      // Reconnect wallet silently
      try {
        const wallet = inAppWallet();
        const account = await wallet.connect({
          client,
          strategy: currentUser.provider === 'google' ? 'google' : 'apple',
          chain: polygon,
        });
        connectedAccount = account;
        connectedWallet = wallet;
      } catch(e) {
        console.log('Auto wallet connect:', e.message);
      }
    }
    loadFeed();
  }

  window.signIn = async function(strategy) {
    try {
      const wallet = inAppWallet();
      const account = await wallet.connect({ client, strategy, chain: polygon });
      connectedAccount = account;
      connectedWallet = wallet;

      try {
        const user = await wallet.getUser();
        console.log('Wallet user:', JSON.stringify(user));
      } catch(e) {
        console.log('getUser error:', e.message);
      }

      console.log('Looking up wallet:', account.address);
      // Look up username via wallet address (lowercase)
      try {
        const data = await firebaseGet(`walletLookup/${account.address.toLowerCase()}`);
        if (data.fields?.username) {
          const username = parseField(data.fields.username);
          currentUser = { userId: account.address, username, provider: strategy, walletAddress: account.address };
          localStorage.setItem('octsn_user', JSON.stringify(currentUser));
          document.getElementById('header-username').textContent = '@' + username;
          document.getElementById('signin-overlay').classList.add('hidden');
          loadFeed();
          return;
        }
      } catch(e) {}

      // New user — show onboarding
      currentUser = { userId: account.address, provider: strategy, walletAddress: account.address };
      document.getElementById('signin-overlay').classList.add('hidden');
      document.getElementById('onboarding-overlay').classList.remove('hidden');

    } catch(e) {
      console.error('Sign in error:', e.message);
    }
  };

  window.browseWithoutSignIn = function() {
    document.getElementById('signin-overlay').classList.add('hidden');
    loadFeed();
  };

  window.completeOnboarding = async function() {
    const username = document.getElementById('username-input').value.trim();
    if (!username || username.length < 3) {
      alert('Username must be at least 3 characters.');
      return;
    }
    if (!/^[a-zA-Z0-9_]+$/.test(username)) {
      alert('Only letters, numbers and underscores allowed.');
      return;
    }

    // Check availability
    try {
      const check = await firebaseGet(`usernames/${username}`);
      if (check.fields) {
        alert('@' + username + ' is taken. Please choose another.');
        return;
      }
    } catch(e) {}

    // Save profile
    const userId = currentUser.userId;
    await firebaseSet(`users/${userId}`, {
      username: { stringValue: username },
      provider: { stringValue: currentUser.provider },
      walletAddress: { stringValue: currentUser.walletAddress },
      joinDate: { stringValue: new Date().toISOString() },
    });
    await firebaseSet(`usernames/${username}`, {
      userId: { stringValue: userId }
    });
    await firebaseSet(`walletLookup/${currentUser.walletAddress.toLowerCase()}`, {
      username: { stringValue: username }
    });

    currentUser = { ...currentUser, username };
    localStorage.setItem('octsn_user', JSON.stringify(currentUser));
    document.getElementById('header-username').textContent = '@' + username;
    document.getElementById('onboarding-overlay').classList.add('hidden');
    loadFeed();
  };

  // ─── LOAD FEED ────────────────────────────────────────────
  async function loadFeed() {
    try {
      // Fetch all NFTs from contract
      const res = await fetch(
        `https://137.insight.thirdweb.com/v1/nfts/${CONTRACT_ADDRESS}?limit=100`,
        { headers: { 'x-client-id': CLIENT_ID } }
      );
      const data = await res.json();
      const nfts = (data.data || []).reverse();
      console.log('First NFT:', JSON.stringify(nfts[0]).substring(0, 300));
      // Fetch marketplace listings
      const provider = new ethers.providers.JsonRpcProvider(`https://137.rpc.thirdweb.com/${CLIENT_ID}`);
      const marketAbi = [
        'function getAllListings(uint256 _startId, uint256 _endId) external view returns (tuple(uint256 listingId, uint256 tokenId, uint256 quantity, uint256 pricePerToken, uint128 startTimestamp, uint128 endTimestamp, address listingCreator, address assetContract, address currency, uint8 tokenType, uint8 status, bool reserved)[] listings)',
        'function totalListings() external view returns (uint256)',
      ];
      const marketplace = new ethers.Contract(MARKETPLACE_ADDRESS, marketAbi, provider);
      let activeListings = [];
      try {
        const total = await marketplace.totalListings();
        if (!total.eq(0)) {
          const listings = await marketplace.getAllListings(0, total.sub(1));
          const now = Math.floor(Date.now() / 1000);
          activeListings = listings.filter(l =>
            parseInt(l.status) === 1 &&
            l.assetContract.toLowerCase() === CONTRACT_ADDRESS.toLowerCase() &&
            parseInt(l.endTimestamp) > now
          );
        }
      } catch(e) { console.log('Listings error:', e.message); }

      document.getElementById('feed-loading').style.display = 'none';

      if (nfts.length === 0) {
        document.getElementById('feed-empty').style.display = 'flex';
        return;
      }

      // Fetch usernames for wallet addresses
      const userCache = {};

      const cards = await Promise.all(nfts.map(async (nft) => {
        const tokenId = nft.token_id;
        const imageUrl = nft.image_url?.startsWith('ipfs://')
          ? `https://${CLIENT_ID}.ipfscdn.io/ipfs/${nft.image_url.slice(7)}`
          : nft.image_url;
        const isVideo = nft.name?.toLowerCase().includes('video');

        // Find listing
        const listing = activeListings.find(l => l.tokenId.toString() === tokenId);
        const isListed = !!listing;
        const priceInPOL = isListed ? ethers.utils.formatEther(listing.pricePerToken) : null;
        const priceInUSD = priceInPOL ? (parseFloat(priceInPOL) * 0.07).toFixed(2) : null;
        const listingId = isListed ? listing.listingId.toString() : null;
        const seller = isListed ? listing.listingCreator : null;

        // Get owner
        let ownerAddress = '';
        let ownerUsername = '—';
        ownerAddress = nft.owner_addresses?.[0] || '';
        
       ownerUsername = ownerAddress ? ownerAddress.substring(0,6) + '...' + ownerAddress.slice(-4) : '—';
      
        ownerUsername = userCache[ownerAddress] || ownerAddress.substring(0,6) + '...' + ownerAddress.slice(-4);
        
        const isOwner = currentUser?.walletAddress?.toLowerCase() === ownerAddress?.toLowerCase();
        return { tokenId, imageUrl, isVideo, isListed, priceInPOL, priceInUSD, listingId, seller, ownerAddress, ownerUsername, isOwner, name: nft.name };
      }));

      renderFeed(cards);

    } catch(e) {
      console.error('Feed error:', e);
      document.getElementById('feed-loading').style.display = 'none';
    }
  }

  function renderFeed(cards) {
    const container = document.getElementById('feed-content');
    container.innerHTML = cards.map(card => `
      <div class="nft-card" data-token="${card.tokenId}">
        ${card.isVideo
          ? `<video class="nft-card-media" src="${card.imageUrl}" autoplay muted loop playsinline></video>`
          : `<img class="nft-card-media" src="${card.imageUrl}" alt="Moment #${card.tokenId}" loading="lazy" />`
        }
        ${card.isListed ? '<div class="listed-border"></div>' : ''}
        <div class="nft-card-token">#${card.tokenId}</div>
        <div class="nft-card-overlay">
          <div class="nft-card-user" onclick="viewProfile('${card.ownerAddress}', '${card.ownerUsername}')">
            <div class="user-avatar">${card.ownerUsername.charAt(0).toUpperCase()}</div>
            <div class="user-info">
              <div class="user-name">@${card.ownerUsername}</div>
              <div class="nft-name">${card.name || 'October-San Moment #' + card.tokenId}</div>
            </div>
          </div>
          <div class="nft-card-actions">
            ${card.isListed && !card.isOwner && currentUser
              ? `<button class="btn-buy" onclick="buyMoment('${card.tokenId}')">BUY · $${card.priceInUSD}</button>`
              : ''
            }
            ${card.isListed && card.isOwner
              ? `<a class="btn-list" href="/buy/${card.tokenId}">MANAGE LISTING</a>`
              : ''
            }
            ${!card.isListed && card.isOwner
              ? `<a class="btn-list" href="/list/${card.tokenId}">LIST FOR SALE</a>`
              : ''
            }
            ${card.isListed && !currentUser
              ? `<button class="btn-buy" onclick="buyMoment('${card.tokenId}')">BUY · $${card.priceInUSD}</button>`
              : ''
            }
          </div>
        </div>
      </div>
    `).join('');
  }

  // ─── ACTIONS ──────────────────────────────────────────────
  window.goMint = function() {
    if (!currentUser) {
      document.getElementById('signin-overlay').classList.remove('hidden');
      return;
    }
    window.location.href = '/mint';
  };

  window.buyMoment = function(tokenId) {
    window.location.href = '/buy/' + tokenId;
  };

  window.viewProfile = function(address, username) {
    window.location.href = '/profile?address=' + address;
  };

  // ─── SERVICE WORKER ───────────────────────────────────────
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(console.error);
  }

  // ─── INIT ─────────────────────────────────────────────────
  checkExistingSession();
</script>

</body>
</html>
