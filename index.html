<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>October-San — Marketplace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --sky: #6BADE8;
      --black: #080A0E;
      --card: #111620;
      --text: #E8EDF5;
      --muted: #6B7A99;
      --faint: #2A3347;
      --green: #6BE8A0;
    }
    body {
      background: var(--black);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      min-height: 100vh;
    }

    /* ─── HEADER ─── */
    header {
      padding: 2rem 2rem 1rem;
      border-bottom: 1px solid var(--faint);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .icon-wrap {
      box-shadow: 0 0 0 1px var(--faint), 0 0 24px rgba(107,173,232,0.8);
      border-radius: 22px;
      margin-bottom: 1rem;
      display: inline-block;
    }
    .icon-wrap img {
      width: 70px;
      height: 70px;
      border-radius: 22px;
      display: block;
    }
    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 2rem;
      color: var(--text);
      margin-bottom: 0.5rem;
    }
    .logo span { color: var(--sky); }
    .marketplace-label {
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }
    .app-link {
      background: var(--sky);
      color: var(--black);
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      padding: 10px 20px;
      border-radius: 4px;
      text-decoration: none;
      display: inline-block;
    }
    .app-link:hover { opacity: 0.85; }

    /* ─── FILTERS ─── */
    .filters {
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--faint);
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .filter-btn {
      background: transparent;
      border: 1px solid var(--faint);
      border-radius: 20px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 1.5px;
      padding: 6px 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn:hover { border-color: var(--sky); color: var(--sky); }
    .filter-btn.active { background: var(--sky); border-color: var(--sky); color: var(--black); }
    .search-input {
      background: var(--card);
      border: 1px solid var(--faint);
      border-radius: 4px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      padding: 6px 12px;
      outline: none;
      margin-left: auto;
      width: 200px;
    }
    .search-input:focus { border-color: var(--sky); }
    .results-count {
      font-size: 10px;
      letter-spacing: 1px;
      color: var(--muted);
      margin-left: 0.5rem;
    }

    /* ─── GRID ─── */
    main {
      padding: 1.5rem 2rem;
      max-width: 1400px;
      margin: 0 auto;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
    }
    .nft-card {
      background: var(--card);
      border: 1px solid var(--faint);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.2s;
      text-decoration: none;
    }
    .nft-card:hover { border-color: var(--sky); }
    .nft-card.listed { border-color: var(--sky); }
    .nft-thumb {
      width: 100%;
      aspect-ratio: 3/4;
      object-fit: cover;
      display: block;
      background: var(--black);
    }
    .nft-thumb-placeholder {
      width: 100%;
      aspect-ratio: 3/4;
      background: var(--black);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 1.5rem;
    }
    .nft-info {
      padding: 10px 12px;
    }
    .nft-token {
      font-size: 10px;
      color: var(--sky);
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .nft-name {
      font-size: 11px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 6px;
    }
    .nft-price {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1rem;
      color: var(--green);
      letter-spacing: 0.05em;
    }
    .nft-price-sub {
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 0.5px;
    }

    /* ─── LOADING ─── */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem;
      gap: 1rem;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 2px;
    }
    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid var(--faint);
      border-top-color: var(--sky);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── EMPTY ─── */
    .empty {
      text-align: center;
      padding: 4rem;
      color: var(--muted);
    }

    /* ─── FOOTER ─── */
    footer {
      text-align: center;
      padding: 2rem;
      color: var(--muted);
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      border-top: 1px solid var(--faint);
      margin-top: 3rem;
      display: flex;
      justify-content: center;
      gap: 2rem;
      flex-wrap: wrap;
    }
    footer a { color: var(--muted); text-decoration: none; }
    footer a:hover { color: var(--sky); }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 600px) {
      header { padding: 1.5rem 1rem 1rem; }
      .filters { padding: 0.75rem 1rem; }
      main { padding: 1rem; }
      .search-input { width: 100%; margin-left: 0; }
      .grid { grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="icon-wrap">
    <img src="/icon.png" alt="October-San" />
  </div>
  <div class="logo">October-<span>San</span>™</div>
  <div class="marketplace-label">MARKETPLACE · POLYGON BLOCKCHAIN</div>
  <a href="https://app.october-san.com" class="app-link">OPEN THE APP ↗</a>
</header>

<div class="filters">
  <button class="filter-btn active" onclick="toggleSort('date')" id="sort-date">NEWEST ↓</button>
  <button class="filter-btn" onclick="toggleSort('price')" id="sort-price">PRICE ↓</button>
  <span class="results-count" id="results-count"></span>
  <input type="search" class="search-input" placeholder="Search moments..." id="search-input" oninput="filterGrid()" />
</div>

<main>
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <span>LOADING MARKETPLACE...</span>
  </div>
  <div id="grid" class="grid" style="display:none;"></div>
  <div id="empty" class="empty" style="display:none;">No moments listed yet.</div>
</main>

<footer>
  <span>© 2026 OCTOBER-SAN LLC</span>
  <a href="/terms">TERMS</a>
  <a href="/privacy">PRIVACY</a>
  <a href="https://app.october-san.com" target="_blank">GET THE APP</a>
</footer>

<script>
  const CLIENT_ID = 'fb1460b2756706cc08a4f650e68fd526';
  const CONTRACT_ADDRESS = '0xfe597C525A68c7150B3923fCfc8Fbf22b95806b1';
  const MARKETPLACE_ADDRESS = '0x353aFb513F80F2D5b56D598EEA203D52D0D635f6';

  let allListings = [];
  let currentSort = 'newest';
  let dateAsc = false;
  let priceAsc = false;

  function toggleSort(type) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    if (type === 'date') {
      dateAsc = !dateAsc;
      currentSort = dateAsc ? 'oldest' : 'newest';
      document.getElementById('sort-date').textContent = dateAsc ? 'OLDEST ↓' : 'NEWEST ↓';
      document.getElementById('sort-date').classList.add('active');
    } else {
      priceAsc = !priceAsc;
      currentSort = priceAsc ? 'price-asc' : 'price-desc';
      document.getElementById('sort-price').textContent = priceAsc ? 'PRICE ↑' : 'PRICE ↓';
      document.getElementById('sort-price').classList.add('active');
    }
    renderGrid();
  }

  async function loadMarketplace() {
    try {
      // Load ethers
      await new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js';
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });

      const provider = new ethers.providers.JsonRpcProvider(`https://137.rpc.thirdweb.com/${CLIENT_ID}`);
      const marketAbi = [
        'function getAllListings(uint256 _startId, uint256 _endId) external view returns (tuple(uint256 listingId, uint256 tokenId, uint256 quantity, uint256 pricePerToken, uint128 startTimestamp, uint128 endTimestamp, address listingCreator, address assetContract, address currency, uint8 tokenType, uint8 status, bool reserved)[] listings)',
        'function totalListings() external view returns (uint256)',
      ];
      const marketplace = new ethers.Contract(MARKETPLACE_ADDRESS, marketAbi, provider);
      const total = await marketplace.totalListings();

      if (total.eq(0)) {
        showEmpty();
        return;
      }

      const listings = await marketplace.getAllListings(0, total.sub(1));
      const now = Math.floor(Date.now() / 1000);
      const active = listings.filter(l =>
        parseInt(l.status) === 1 &&
        l.assetContract.toLowerCase() === CONTRACT_ADDRESS.toLowerCase() &&
        parseInt(l.endTimestamp) > now
      );

      if (active.length === 0) {
        showEmpty();
        return;
      }

      // Fetch NFT metadata for each listing
      allListings = await Promise.all(active.map(async (l) => {
        const tokenId = l.tokenId.toString();
        const priceInPOL = ethers.utils.formatEther(l.pricePerToken);
        const priceInUSD = (parseFloat(priceInPOL) * 0.07).toFixed(2);
        const listingId = l.listingId.toString();

        try {
          const res = await fetch(
            `https://137.insight.thirdweb.com/v1/nfts/${CONTRACT_ADDRESS}/${tokenId}`,
            { headers: { 'x-client-id': CLIENT_ID } }
          );
          const data = await res.json();
          const nft = data.data?.[0];
          const imageUrl = nft?.image_url?.startsWith('ipfs://')
            ? `https://${CLIENT_ID}.ipfscdn.io/ipfs/${nft.image_url.slice(7)}`
            : nft?.image_url;
          return { tokenId, listingId, priceInPOL, priceInUSD, imageUrl, name: nft?.name || `Moment #${tokenId}` };
        } catch(e) {
          return { tokenId, listingId, priceInPOL, priceInUSD, imageUrl: null, name: `Moment #${tokenId}` };
        }
      }));

      document.getElementById('loading').style.display = 'none';
      renderGrid();

    } catch(e) {
      console.error('Marketplace error:', e);
      showEmpty();
    }
  }

  function renderGrid() {
    const search = document.getElementById('search-input').value.toLowerCase();
    let filtered = allListings.filter(l =>
      !search || l.name.toLowerCase().includes(search) || l.tokenId.includes(search)
    );

    filtered = filtered.sort((a, b) => {
      if (currentSort === 'newest') return parseInt(b.tokenId) - parseInt(a.tokenId);
      if (currentSort === 'oldest') return parseInt(a.tokenId) - parseInt(b.tokenId);
      if (currentSort === 'price-asc') return parseFloat(a.priceInUSD) - parseFloat(b.priceInUSD);
      if (currentSort === 'price-desc') return parseFloat(b.priceInUSD) - parseFloat(a.priceInUSD);
      return 0;
    });

    document.getElementById('results-count').textContent = `${filtered.length} LISTED`;

    if (filtered.length === 0) {
      document.getElementById('grid').style.display = 'none';
      showEmpty();
      return;
    }

    document.getElementById('empty').style.display = 'none';
    document.getElementById('grid').style.display = 'grid';
    document.getElementById('grid').innerHTML = filtered.map(l => `
      <a href="/buy/${l.tokenId}" class="nft-card listed">
        ${l.imageUrl
          ? `<img class="nft-thumb" src="${l.imageUrl}" alt="Moment #${l.tokenId}" loading="lazy" />`
          : `<div class="nft-thumb-placeholder">◆</div>`
        }
        <div class="nft-info">
          <div class="nft-token">#${l.tokenId}</div>
          <div class="nft-name">${l.name}</div>
          <div class="nft-price">$${l.priceInUSD}</div>
          <div class="nft-price-sub">${parseFloat(l.priceInPOL).toFixed(2)} POL</div>
        </div>
      </a>
    `).join('');
  }

  function setSort(sort) {
    currentSort = sort;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('sort-' + sort).classList.add('active');
    renderGrid();
  }

  function filterGrid() { renderGrid(); }

  function showEmpty() {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('grid').style.display = 'none';
    document.getElementById('empty').style.display = 'block';
  }

  loadMarketplace();
  // Only show tap-twice hint on mobile
  const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  if (!isMobile) {
    const hint = document.getElementById('auth-hint');
    if (hint) hint.style.display = 'none';
  }
</script>

</body>
</html>
